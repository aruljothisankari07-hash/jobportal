<section class="jobs">

<h2>Saved Jobs ❤️</h2>

<div id="savedJobsContainer"></div>

</section>

<script>
function loadSavedJobs(){

let jobs = JSON.parse(localStorage.getItem("savedJobs")) || [];

let container = document.getElementById("savedJobsContainer");

container.innerHTML = "";

if(jobs.length === 0){
container.innerHTML = "<h3>No Saved Jobs Yet ❌</h3>";
return;
}

jobs.forEach((job, index)=>{

container.innerHTML += `
<div class="job-card">
<h3>${job}</h3>
<p>Saved Successfully ✅</p>

<button onclick="removeJob(${index})" style="background:red;margin-top:10px;">
Remove
</button>

</div>
`;

});

}

function removeJob(index){

let jobs = JSON.parse(localStorage.getItem("savedJobs")) || [];

jobs.splice(index, 1);

localStorage.setItem("savedJobs", JSON.stringify(jobs));

loadSavedJobs();

}

loadSavedJobs();
</script>

<script src="script.js"></script>

</body>
</html>
